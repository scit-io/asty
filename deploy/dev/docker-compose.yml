services:

  # NATS больше не запускается из docker compose — каждый Asty-агент
  # супервизит собственный nats-server на своём 127.0.0.$i (см. start.sh).

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       platform
      POSTGRES_USER:     platform
      POSTGRES_PASSWORD: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "${A_DOCKER_CPUS}"
          memory: ${A_MEMORY_TOTAL}M
    networks:
      - asty

networks:
  asty:

volumes:
  postgres_data:
