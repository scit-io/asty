# golangci-lint configuration for Asty.
#
# Locked-in cheap-to-enforce invariants:
#
#   - os.Getenv is forbidden outside core/config (single config path).
#   - api/* may depend on server only through the ServerContext
#     interface, never by direct import.
#   - core/* may not import anything from infra/domain/ops/api or the
#     composition roots.
#
# Run with `make lint` (golangci-lint run) — kept out of `make ci` so
# the aggregator does not require a third-party tool.

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - depguard
    - govet
    - staticcheck
    - unused
    - gosimple

linters-settings:
  depguard:
    rules:
      # No raw env reads outside the single config path.
      env:
        list-mode: lax
        files:
          - "**/asty/internal/**/*.go"
          - "!**/asty/internal/core/config/**/*.go"
        deny:
          - pkg: "os"
            desc: "os.Getenv/Setenv outside core/config violates the single-config-path rule; add the field to core/config and read it through cfg."
        # The os package itself is OK; we only block os.Getenv/Setenv
        # via the pattern below. depguard cannot block individual
        # symbols, so this rule is informational — pair with a CI grep
        # that fails on `os\.Getenv` outside core/config.

      # L0 core: no internal/* deps at all.
      core_purity:
        files:
          - "**/asty/internal/core/**/*.go"
        deny:
          - pkg: "asty/asty/internal/infra"
            desc: "core/* is L0; it may not import infra/* (L1)."
          - pkg: "asty/asty/internal/domain"
            desc: "core/* is L0; it may not import domain/* (L2)."
          - pkg: "asty/asty/internal/ops"
            desc: "core/* is L0; it may not import ops/* (L3)."
          - pkg: "asty/asty/internal/api"
            desc: "core/* is L0; it may not import api/* (L4)."
          - pkg: "asty/asty/internal/server"
            desc: "core/* is L0; it may not import the server composition root."
          - pkg: "asty/asty/internal/agent"
            desc: "core/* is L0; it may not import the agent composition root."

      # L1 infra: may depend on core only.
      infra_purity:
        files:
          - "**/asty/internal/infra/**/*.go"
        deny:
          - pkg: "asty/asty/internal/domain"
            desc: "infra/* is L1; it may not import domain/* (L2)."
          - pkg: "asty/asty/internal/ops"
            desc: "infra/* is L1; it may not import ops/* (L3)."
          - pkg: "asty/asty/internal/api"
            desc: "infra/* is L1; it may not import api/* (L4)."
          - pkg: "asty/asty/internal/server"
            desc: "infra/* is L1; it may not import composition roots."
          - pkg: "asty/asty/internal/agent"
            desc: "infra/* is L1; it may not import composition roots."

      # L2 domain: pure types + state machines, no infra or above.
      domain_purity:
        files:
          - "**/asty/internal/domain/**/*.go"
        deny:
          - pkg: "asty/asty/internal/infra"
            desc: "domain/* is L2; it may not import infra/* (L1)."
          - pkg: "asty/asty/internal/ops"
            desc: "domain/* is L2; it may not import ops/* (L3)."
          - pkg: "asty/asty/internal/api"
            desc: "domain/* is L2; it may not import api/* (L4)."
          - pkg: "asty/asty/internal/server"
            desc: "domain/* is L2; it may not import composition roots."
          - pkg: "asty/asty/internal/agent"
            desc: "domain/* is L2; it may not import composition roots."

      # L4 api edges: may not import composition roots; talks to ops/
      # via interfaces (e.g. ServerContext).
      api_purity:
        files:
          - "**/asty/internal/api/**/*.go"
        deny:
          - pkg: "asty/asty/internal/server"
            desc: "api/* is L4; depend on server only through the ServerContext interface."
          - pkg: "asty/asty/internal/agent"
            desc: "api/* is L4; depend on the agent through its handler surface, not by import."

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - depguard
